services:
  - type: web
    name: studymate-ai
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MOCK_AI_RESPONSE
        value: false
